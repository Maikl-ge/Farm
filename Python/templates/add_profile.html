<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Profile</title>
</head>
<body>
    <h1>Add Profile</h1>
    <form method="post">
        <label for="nameProfile">Name Profile:</label>
        <input type="text" id="nameProfile" name="nameProfile" required><br>

        <label for="cycle">Cycle:</label>
        <input type="number" id="cycle" name="cycle" required><br>

        <label for="sunrise">Sunrise:</label>
        <input type="time" id="sunrise" name="sunrise" required><br>

        <label for="sunset">Sunset:</label>
        <input type="time" id="sunset" name="sunset" required><br>

        <label for="dayTemperatureStart">Day Temperature Start:</label>
        <input type="number" step="0.1" id="dayTemperatureStart" name="dayTemperatureStart" required><br>

        <label for="dayTemperatureEnd">Day Temperature End:</label>
        <input type="number" step="0.1" id="dayTemperatureEnd" name="dayTemperatureEnd" required><br>

        <label for="nightTemperatureStart">Night Temperature Start:</label>
        <input type="number" step="0.1" id="nightTemperatureStart" name="nightTemperatureStart" required><br>

        <label for="nightTemperatureEnd">Night Temperature End:</label>
        <input type="number" step="0.1" id="nightTemperatureEnd" name="nightTemperatureEnd" required><br>

        <label for="dayHumidityStart">Day Humidity Start:</label>
        <input type="number" step="0.1" id="dayHumidityStart" name="dayHumidityStart" required><br>

        <label for="dayHumidityEnd">Day Humidity End:</label>
        <input type="number" step="0.1" id="dayHumidityEnd" name="dayHumidityEnd" required><br>

        <label for="nightHumidityStart">Night Humidity Start:</label>
        <input type="number" step="0.1" id="nightHumidityStart" name="nightHumidityStart" required><br>

        <label for="nightHumidityEnd">Night Humidity End:</label>
        <input type="number" step="0.1" id="nightHumidityEnd" name="nightHumidityEnd" required><br>

        <label for="waterTemperature">Water Temperature:</label>
        <input type="number" step="0.1" id="waterTemperature" name="waterTemperature" required><br>

        <label for="dayWateringInterval">Day Watering Interval (HH:MM):</label>
        <input type="text" id="dayWateringInterval" name="dayWateringInterval" required><br>

        <label for="nightWateringInterval">Night Watering Interval (HH:MM):</label>
        <input type="text" id="nightWateringInterval" name="nightWateringInterval" required><br>

        <label for="dayCirculation">Day Circulation:</label>
        <input type="number" id="dayCirculation" name="dayCirculation" required><br>

        <label for="nightCirculation">Night Circulation:</label>
        <input type="number" id="nightCirculation" name="nightCirculation" required><br>

        <label for="dayVentilation">Day Ventilation:</label>
        <input type="number" id="dayVentilation" name="dayVentilation" required><br>

        <label for="nightVentilation">Night Ventilation:</label>
        <input type="number" id="nightVentilation" name="nightVentilation" required><br>

        <input type="submit" value="Save">
    </form>
</body>
</html>
