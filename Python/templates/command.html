<html lang="ru">
<head>
    <meta charset="UTF-8">

    <title>Farm Parameters</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 14px;
            margin: 0;
            padding: 15px;
            background: #1e1e1e;
            color: #fff;
        }
        h1 {
            font-weight: 400;
            color: #aaa;
            font-size: clamp(16px, 4vw, 18px);
            margin: 0 0 10px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }
        form {
            background: #2e2e2e;
            padding: clamp(10px, 3vw, 20px);
            border-radius: 10px;
            border: 1px solid #e74c3c;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            box-sizing: border-box;
        }
        form.connected {
            border-color: #00ff99;
        }
        .form-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 10px;
        }
        .form-column {
            flex: 1;
            min-width: 0;
        }
        .input-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            gap: 10px;
        }
        .input-container label {
            flex: 1;
            text-align: left;
            color: #aaa;
            font-weight: 300;
            font-size: clamp(12px, 3vw, 14px);
        }
        .input-container span {
            flex: 0.8;
            padding: 5px;
            font-weight: 300;
            font-size: clamp(12px, 3vw, 14px);
            color: #ccc;
            background: #3e3e3e;
            border-radius: 5px;
            text-align: left;
            box-sizing: border-box;
        }
        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
            margin-bottom: 10px;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: clamp(5px, 2vw, 8px);
            background: #3e3e3e;
            color: #aaa;
            cursor: pointer;
            border-radius: 5px 5px 0 0;
            font-weight: 400;
            font-size: clamp(10px, 2.5vw, 12px);
            transition: background 0.3s, color 0.3s;
        }
        .tab.active {
            background: #aaa;
            color: #1e1e1e;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }

	    .refresh-btn {
    width: 100%; /* Полная ширина контейнера с ограничением ниже */
    max-width: 190px; /* Максимальная ширина кнопки */
    padding: 5px; /* Внутренние отступы (влияют на общий размер) */
    font-size: clamp(12px, 3vw, 14px); /* Размер шрифта, влияет на высоту и читаемость */
    margin: 4px; /* Внешние отступы, влияют на расстояние между кнопками */
            background: #3e3e3e;
            color: #aaa;
            border: 1px solid #3e3e3e;
            border-radius: 4px;
            cursor: pointer;
            transition: border-color 0.3s, background 0.3s;
            box-sizing: border-box;
        }
        .refresh-btn:hover {
            border-color: #27ae60;
            background: #4e4e4e;
        }
        .refresh-btn.active {
            border-color: #e74c3c;
        }
        form.connected .refresh-btn.active {
            border-color: #00ff99;
        }
        .button-disconnected {
            background: #3e3e3e !important;
            border-color: #e74c3c !important;
        }
        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 1px;
            justify-content: center;
            margin-bottom: 10px;
        }

        /* Медиа-запросы для адаптивности */
        @media (max-width: 768px) {
            .container {
                max-width: 100%;
                padding: 0 10px;
            }
            .form-row {
                flex-direction: column;
                gap: 5px;
            }
            .form-column {
                width: 100%;
            }
            .input-container {
                flex-direction: row;
                align-items: center;
            }
            .input-container label {
                flex: 1;
            }
            .input-container span {
                flex: 1;
            }
            .tabs {
                flex-direction: row;
                flex-wrap: wrap;
            }
            .tab {
                flex: 1 1 30%;
            }
            .refresh-btn {
                max-width: 100%;
            }
        }

        @media (max-width: 500px) {
            body {
                padding: 5px;
            }

                font-size: 16px;
            }
            .input-container {
                flex-direction: column;
                align-items: stretch;
                gap: 5px;

            .input-container span {

            }
            .tabs {

                gap: 5px;
            }
            .tab {
                flex: 1 1 60%;
                border-radius: 5px;
            }
            .refresh-btn {
                font-size: 12px;
                padding: 6px;
            }
        }

    </style>

    <script>
        let websocketCheckInterval;

	    window.onload = async function () {
		document.querySelectorAll('.tab').forEach((tab, index) => {
			tab.addEventListener('click', () => showTab(index + 1));
		});
	
		showTab(1);
	
		// 1. Отправляем первую команду
		await new Promise(resolve => {
			sendCommand('SRSE', '12', { classList: { add: () => {}, remove: () => {} } });  // эмуляция кнопки
			setTimeout(resolve, 1500);  // Пауза 1 сек
		});
	
		// 2. Потом загружаем всё остальное
		loadFrqsData();
		checkWebsocketState();
		websocketCheckInterval = setInterval(checkWebsocketState, 5000);
        };

        window.onbeforeunload = function() {
            if (websocketCheckInterval) clearInterval(websocketCheckInterval);
        };

        function showTab(tabNumber) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.querySelector(`.tab:nth-child(${tabNumber})`).classList.add('active');
            document.getElementById(`tab${tabNumber}`).classList.add('active');
        }

        function populateForm(data) {
            document.getElementById('nameProfile').innerText = data.nameprofile || '';
            document.getElementById('cycle').innerText = data.cycle || '';
            document.getElementById('sunrise').innerText = formatMinutesToTime(data.sunrise) || '';
            document.getElementById('sunset').innerText = formatMinutesToTime(data.sunset) || '';

            for (let i = 1; i <= 6; i++) {
                document.getElementById(`phase${i}_duration`).innerText = (Number.isFinite(data[`phase${i}_duration`]) ? data[`phase${i}_duration`] : 0);
                document.getElementById(`phase${i}_temp`).innerText = data[`phase${i}_temp`] || '';
                document.getElementById(`phase${i}_hum`).innerText = data[`phase${i}_hum`] || '';
                document.getElementById(`phase${i}_water_temp`).innerText = data[`phase${i}_water_temp`] || '';
                document.getElementById(`phase${i}_light`).innerText = data[`phase${i}_light`] || '';
                document.getElementById(`phase${i}_circ`).innerText = data[`phase${i}_circ`] || '';
                document.getElementById(`phase${i}_vent`).innerText = data[`phase${i}_vent`] || '';
                document.getElementById(`phase${i}_watering`).innerText = data[`phase${i}_watering`] || '';
                document.getElementById(`phase${i}_draining`).innerText = data[`phase${i}_draining`] || '';
                document.getElementById(`phase${i}_rot`).innerText = data[`phase${i}_rot`] || '';
            }
        }

        async function checkWebsocketState() {
            try {
                const response = await fetch('/api/websocket-state');
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const data = await response.json();
                updateConnectionStatus(data.state);
            } catch (error) {
                updateConnectionStatus('disconnected');
            }
        }

        function updateConnectionStatus(state) {
            const form = document.getElementById('profileForm');
            if (state === 'connected') {
                form.classList.add('connected');
            } else {
                form.classList.remove('connected');
            }
        }

        function formatMinutesToTime(minutes) {
            if (!minutes) return '';
            const hours = Math.floor(minutes / 60);
            const mins = minutes % 60;
            return `${String(hours).padStart(2, '0')}:${String(mins).padStart(2, '0')}`;
        }

        async function loadFrqsData(event) {
            const button = event ? event.target : document.querySelector('button[onclick="loadFrqsData(event)"]');
            button.classList.add('active');
            try {
                const response = await fetch('/api/frqs');
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const data = await response.json();
                populateForm(data);
                setTimeout(() => button.classList.remove('active'), 500);
            } catch (error) {
                button.classList.remove('active');
            }
        }

        function sendCommand(command, ask_comm, button) {
            button.classList.add('active');
            fetch('/command/send_cmd', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ command, ask_comm })
            })
            .then(response => response.json())
            .then(data => {
                setTimeout(() => button.classList.remove('active'), 500);
            })
            .catch(error => {
                button.classList.remove('active');
            });
        }

		function SendCMD(event) { sendCommand('SRSE', '12', event.target); }
		function RebootCMD(event) { sendCommand('SCMR', '12', event.target); }
			
		function StartCMD(event) {
			const password = prompt("Enter password:");
			if (password === "Farm") {
				sendCommand('SCMD', '12', event.target);
			} else {
				alert("Error password");
			}
		}
		
		function StopCMD(event) {
			const password = prompt("Enter password:");
			if (password === "Farm") {
				sendCommand('SCMS', '12', event.target);
			} else {
				alert("Error password");
			}
		}		
		
		

        function UpdataCMD(event) { sendCommand('SCMU', '12', event.target); }
        function SendDATA(event) { sendCommand('SRDT', '12', event.target); }
        function StatusCMD(event) { sendCommand('SRST', '12', event.target); }
        function PauseCMD(event) { sendCommand('SRSP', '12', event.target); }
    </script>
