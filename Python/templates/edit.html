<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <title>Edit Profile</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 14px;
            background-color: #1e1e1e;
            margin: 5px;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        h1 {
            text-align: center;
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            color: #aaa;
            font-size: 18px;
            margin-bottom: 5px;
        }
        form {
            background: #2e2e2e;
            font-family: 'Inter', sans-serif;
            font-weight: 300;
            color: #aaa;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 90%;
        }
        .form-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        .form-column {
            width: 48%;
        }
        label {
            font-family: 'Inter', sans-serif;
            font-weight: 300;
            display: block;
            margin-bottom: 5px;
        }
        .input-container {
            font-family: 'Inter', sans-serif;
            font-weight: 300;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .input-container label {
            width: 55%;
            text-align: left;
        }
        .input-container input {
            width: 30%;
            padding: 5px;
            font-family: 'Inter', sans-serif;
            font-weight: 300;
            font-size: 14px;
            color: #aaa;
            background-color: transparent;
            border: 0px solid #6d6d6d;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .tabs {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            overflow-x: auto;
            white-space: nowrap;
        }
        .tab {
            flex: 1;
            min-width: 80px;
            text-align: center;
            padding: 5px;
            background: #3e3e3e;
            color: #aaa;
            cursor: pointer;
            border-radius: 5px 5px 0 0;
            margin-right: 2px;
            font-family: 'Inter', sans-serif;
            font-weight: 400;
        }
        .tab.active {
            background: #aaa;
            color: #1e1e1e;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        input[type="submit"] {
            background-color: transparent;
            color: #aaa;
            border: 1px solid #6d6d6d;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            font-size: 14px;
        }
        input[type="submit"]:hover {
            background-color: #aaa;
            color: #1e1e1e;
        }
        .error-message {
            color: #ff5555;
            text-align: center;
            margin-top: 10px;
            display: none;
            font-family: 'Inter', sans-serif;
            font-weight: 400;
        }
        /* Стили для контейнера с профилями */
        .profiles-container {
            background: #2e2e2e;
            padding: 5px;

            max-width: 600px;
            width: 100%;
            margin-bottom: 10px;
            justify-content: center;
            color: #aaa;
        }
        .profiles-row {
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
        }
        .profile-item {
            width: 38%;
            text-align: left;
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            background: #3e3e3e;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
            border: 1px solid #aaa; /* Тонкая рамка вокруг элементов */
        }
        @media (max-width: 600px) {
            .form-row { flex-direction: column; }
            .form-column { width: 100%; }
            .input-container label { width: 50%; }
            .input-container input { width: 45%; }
            .tabs { font-size: 12px; }
            .tab { padding: 6px; }
            input[type="submit"] { padding: 12px; }
            .profiles-row { flex-direction: column; }
            .profile-item { width: 100%; margin-bottom: 10px; }
        }
    </style>
</head>

<script>
window.onload = function() {
    console.log('Скрипт успешно загружен');
    document.querySelectorAll('.tab').forEach((tab, index) => {
        tab.addEventListener('click', () => showTab(index + 1));
    });
    showTab(1);
};

function selectProfile(id) {
    console.log(`Выбран профиль с ID: ${id}`);
    document.getElementById('profileId').value = id;

    fetch(`http://207.244.250.144:8080/read_profile_db?id=${id}`, {
        method: 'GET',
        headers: {
            'Content-Type': 'application/json'
        }
    })
    .then(response => {
        if (!response.ok) {
            throw new Error('Ошибка при загрузке профиля');
        }
        return response.json();
    })
    .then(data => {
        console.log('Данные профиля:', data);
        populateForm(data);
    })
    .catch(error => {
        console.error('Ошибка:', error);
        document.getElementById('errorMessage').textContent = 'Ошибка при загрузке профиля';
        document.getElementById('errorMessage').style.display = 'block';
    });
}

function populateForm(data) {
    document.getElementById('profileId').value = data.id || '';
    document.getElementById('nameProfile').value = data.nameProfile || '';
    document.getElementById('cycle').value = data.cycle || '';
    document.getElementById('sunrise').value = data.sunrise || '';
    document.getElementById('sunset').value = data.sunset || '';

    if (data.phases && Array.isArray(data.phases)) {
        data.phases.forEach((phase, index) => {
            const tabNumber = index + 1;
            if (tabNumber <= 6) {
				document.getElementById(phase${tabNumber}_duration).value = phase.duration || ' ';
                document.getElementById(`phase${tabNumber}_temp`).value = phase.temp || '';
                document.getElementById(`phase${tabNumber}_hum`).value = phase.hum || '';
                document.getElementById(`phase${tabNumber}_water_temp`).value = phase.waterTemp || '';
                document.getElementById(`phase${tabNumber}_watering`).value = phase.watering || '';
                document.getElementById(`phase${tabNumber}_vent`).value = phase.vent || '';
                document.getElementById(`phase${tabNumber}_circ`).value = phase.circ || '';
                document.getElementById(`phase${tabNumber}_rot`).value = phase.rot || '';
                document.getElementById(`phase${tabNumber}_draining`).value = phase.draining || '';
                document.getElementById(`phase${tabNumber}_light`).value = phase.light || '';
            }
        });
    }
}

function showTab(tabNumber) {
    console.log(`Переключение на вкладку ${tabNumber}`);
    document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
    document.querySelector(`.tab:nth-child(${tabNumber})`).classList.add('active');
    document.getElementById(`tab${tabNumber}`).classList.add('active');
}

</script>
</body>
