<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;600&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <title>System Parameters</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .profile-list, .profile-item, .profile-name, .edit-button, .select-button, .page-title {
            font-family: 'Inter', sans-serif;
        }
        .profile-list {
            font-weight: 600;
            font-size: 16px;
            list-style-type: none;
            padding: 20px;
        }
        .profile-item {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }
        .profile-name {
            width: 80px;
            background-color: transparent;
            border: none;
            padding: 5px;
        }
        .edit-button, .select-button {
            font-weight: 400;
            padding: 5px 10px;
            font-size: 16px;
            background-color: transparent;
            color: #333;
            border: 1px solid #333;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            margin-left: 2px;
        }
        .edit-button:hover, .select-button:hover {
            background-color: #d3d3d3;
            color: #333;
        }
        .page-title {
            padding: 10px;
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="page-title">System Parameters</h1>
        {% if params %}
            <ul class="profile-list">
                {% for param in params %}
                    <li class="profile-item">
                        <a href="/parameters/{{param.id}}/select" class="select-button">Select</a>
                        <span class="profile-name">{{ param.nameprofile }}</span>
                        <a href="/parameters/{{param.id}}/edit" class="edit-button">Edit Profile</a>
                    </li>
                {% endfor %}
            </ul>
        {% else %}
            <p>No profiles found.</p>
        {% endif %}
    </div>
</body>
</html>
